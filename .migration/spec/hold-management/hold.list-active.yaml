capability: hold.list-active
title: List active holds
cases:
  - title: Active holds are listed in sequence order (the recording's seed supplied H1)
    rule: sequence-order
    given:
      clock: "2026-11-23"
      requests:
        - {method: POST, path: /holds, form: {member: bo, isbn: "9780134685991"}, clock: "2026-10-24"}
        - {method: POST, path: /loans, form: {member: cy, isbn: "9781111111111"}}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: eli, isbn: "9781111111111"}}
    examples:
      columns: [recording, exchange]
      rows:
        - [.migration/characterization/source/goldens/hold-listing.json, "GET /holds ordered"]
    when: {replay: {recording: "{recording}", exchange: "{exchange}"}}
    then: {replay: {body: exact, mask: ['(?m)^H[0-9]+(?=;)']}}

  - title: An ISBN filter narrows the active list
    rule: isbn-filter
    given:
      clock: "2026-11-23"
      requests:
        - {method: POST, path: /loans, form: {member: cy, isbn: "9781111111111"}}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: eli, isbn: "9781111111111"}}
    when: {replay: {recording: .migration/characterization/source/goldens/hold-listing.json, exchange: "GET /holds filtered second isbn"}}
    then: {replay: {body: exact}}

  - title: An unknown ISBN filter returns an empty list
    rule: isbn-filter
    given: {clock: "2026-11-23"}
    when: {replay: {recording: .migration/characterization/source/goldens/hold-listing.json, exchange: "GET /holds filtered unknown isbn"}}
    then: {replay: {body: exact}}

  - title: A hold remains listed on its expiry date (the recording's seed supplied H1)
    rule: active-through-expiry-day
    given:
      clock: "{today}"
      requests:
        - {method: POST, path: /holds, form: {member: bo, isbn: "9780134685991"}, clock: "2026-10-24"}
    when: {replay: {recording: .migration/characterization/source/goldens/hold-listing.json, exchange: "GET /holds on expiry date"}}
    then: {replay: {body: exact, mask: ['(?m)^H[0-9]+(?=;)']}}

  - title: An expired hold is absent the next day
    rule: active-through-expiry-day
    given:
      clock: "2026-11-24"
      requests:
        - {method: POST, path: /holds, form: {member: bo, isbn: "9780134685991"}, clock: "2026-10-24"}
    when: {replay: {recording: .migration/characterization/source/goldens/hold-expired.json, exchange: "GET /holds one day after expiry"}}
    then: {replay: {body: exact}}

  - title: An empty or blank-filter result is one newline
    rule: empty-result
    given: {clock: "2026-11-23"}
    examples:
      columns: [recording, exchange]
      rows:
        - [.migration/characterization/source/goldens/http.json, "GET /holds"]
        - [.migration/characterization/source/goldens/edge-cases.json, "GET /holds filtered empty"]
    when: {replay: {recording: "{recording}", exchange: "{exchange}"}}
    then: {replay: {body: exact}}

  - title: Cancelled holds do not appear in the active list
    rule: cancelled-excluded
    given:
      clock: "2026-11-23"
      requests:
        - {method: POST, path: /loans, form: {member: cy, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds/H2/cancel}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: eli, isbn: "9780134685991"}}
    when: {replay: {recording: .migration/characterization/source/goldens/edge-cases.json, exchange: "GET /holds after writes"}}
    then: {replay: {body: exact}}
