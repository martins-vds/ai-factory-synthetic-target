capability: hold.repository
title: Query and persist holds
cases:
  - title: Reads return active holds in order (the recording's seed supplied H1)
    rule: active-query-order-filter
    given:
      clock: "2026-11-23"
      requests:
        - {method: POST, path: /holds, form: {member: bo, isbn: "9780134685991"}, clock: "2026-10-24"}
        - {method: POST, path: /loans, form: {member: cy, isbn: "9781111111111"}}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: eli, isbn: "9781111111111"}}
    examples:
      columns: [exchange]
      rows:
        - ["GET /holds ordered"]
    when: {replay: {recording: .migration/characterization/source/goldens/hold-listing.json, exchange: "{exchange}"}}
    then: {replay: {body: exact, mask: ['(?m)^H[0-9]+(?=;)']}}

  - title: Reads apply the optional ISBN filter
    rule: active-query-order-filter
    given:
      clock: "2026-11-23"
      requests:
        - {method: POST, path: /loans, form: {member: cy, isbn: "9781111111111"}}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: eli, isbn: "9781111111111"}}
    when: {replay: {recording: .migration/characterization/source/goldens/hold-listing.json, exchange: "GET /holds filtered second isbn"}}
    then: {replay: {body: exact}}

  - title: A new hold uses the next sequence-based identifier
    rule: next-sequence-id
    given:
      clock: "2026-11-23"
      requests:
        - {method: POST, path: /loans, form: {member: ana, isbn: "9780134685991"}}
    when: {replay: {recording: .migration/characterization/source/goldens/http.json, exchange: "POST /holds"}}
    then: {replay: {body: exact}}

  - title: Active holds written earlier remain readable unless cancelled or expired
    rule: persisted-holds-readable
    given:
      clock: "2026-11-23"
      requests:
        - {method: POST, path: /loans, form: {member: cy, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds/H2/cancel}
        - {method: POST, path: /holds, form: {member: dee, isbn: "9780134685991"}}
        - {method: POST, path: /holds, form: {member: eli, isbn: "9780134685991"}}
    when: {replay: {recording: .migration/characterization/source/goldens/edge-cases.json, exchange: "GET /holds after writes"}}
    then: {replay: {body: exact}}
