capability: fees.calculation
title: Late fees
# The seed loans (L1 out since 2026-01-02, due 2026-01-16; L2 back early; L3 back 19 days late) come with the
# database. Oracles (ADR-0062): the legacy app recorded L1 capped at $10.00, L2 at $0.00 and L3 at 19 days, $4.75.
# It could not reach exactly 1-3 days late through HTTP, so the waiver-boundary rows (0, 2 and 3 days) follow the
# legacy formula as characterization-SY-05 records it (LateFeeView.java:31-37, "source-predicted").
cases:
  - title: A loan still out costs nothing for two days late, then 25 cents a day, never more than ten dollars
    rule: [late-days-end-at-return, fee-waived-two-days, fee-25-cents-a-day, fee-capped-at-10]
    oracle: .migration/references/characterization-SY-05.md
    given: {clock: "{today}"}
    examples:
      columns: [today, days, fee]
      rows:
        - ["2026-01-16", 0, "$0.00"]
        - ["2026-01-18", 2, "$0.00"]
        - ["2026-01-19", 3, "$0.75"]
        - ["2026-02-24", 39, "$9.75"]
        - ["2026-02-25", 40, "$10.00"]
        - ["2026-06-30", 165, "$10.00"]
    when: {http: {method: GET, path: /fees/L1}}
    then: {status: 200, text: ["{days} day(s) late", "Fee: {fee}"]}

  - title: A returned loan's fee stops at its return date, whatever today is
    rule: late-days-end-at-return
    oracle: .migration/characterization/source/goldens/http.json
    given: {clock: "2026-11-22"}
    examples:
      columns: [loan, days, fee]
      rows:
        - [L3, 19, "$4.75"]
        - [L2, 0, "$0.00"]
    when: {http: {method: GET, path: "/fees/{loan}"}}
    then: {status: 200, text: ["{days} day(s) late", "Fee: {fee}"]}

  - title: The fee page shows the same fee
    rule: fee-25-cents-a-day
    oracle: .migration/characterization/source/goldens/browser.json
    when: {http: {method: GET, path: /ui/fees/L3/}}
    then: {status: 200, text: ["Late fee for L3", "19 day(s) late", "Fee: $4.75"]}

  - title: There is no fee for a loan that doesn't exist
    rule: unknown-loan-404
    oracle: .migration/characterization/source/goldens/edge-cases.json
    when: {http: {method: GET, path: /fees/L9}}
    then: {status: 404, text: ["No such loan."]}

  - title: Each recorded fee answer comes back the same
    rule: [late-days-end-at-return, fee-25-cents-a-day, fee-capped-at-10, unknown-loan-404]
    given: {clock: "{recorded_on}"}
    examples:
      columns: [recording, exchange, recorded_on]
      rows:
        - [".migration/characterization/source/goldens/http.json", "GET /fees/{id}", "2026-11-08"]
        - [".migration/characterization/source/goldens/edge-cases.json", "GET /fees/L1 before return", "2026-11-08"]
        - [".migration/characterization/source/goldens/edge-cases.json", "GET /fees/L2 early return", "2026-11-08"]
        - [".migration/characterization/source/goldens/edge-cases.json", "GET /fees/unknown", "2026-11-08"]
    when: {replay: {recording: "{recording}", exchange: "{exchange}"}}
    then: {replay: {body: text}}

