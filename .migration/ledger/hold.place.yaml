boundary: "POST /holds requires nonblank member and isbn (400 otherwise); returns 409 if the ISBN has no open loan, the requester has that loan, or the requester already has an active hold for that ISBN. It checks activeFor(member) > 3 before creating a hold, so a member with three active holds can create a fourth; this discrepancy is raised as quirk martins-vds/ai-factory-synthetic-target#170. Success creates H{max sequence + 1} dated today and returns 201 with a semicolon-separated hold line and trailing newline."
slice: hold-management
