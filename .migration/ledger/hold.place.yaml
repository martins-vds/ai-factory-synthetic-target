rules:
  - id: required-fields
    rule: Missing or whitespace-only member or ISBN returns HTTP 400.
    source: legacy/src/main/java/lib/HoldResource.java:37-40
  - id: on-loan
    rule: A hold may be placed only when the ISBN has an open loan and the requesting member is not the borrower.
    source: legacy/src/main/java/lib/HoldResource.java:41-48
  - id: no-duplicate-active-hold
    rule: A member with an active hold for the ISBN is rejected with HTTP 409.
    source: legacy/src/main/java/lib/HoldResource.java:49-51
  - id: active-hold-limit
    rule: The source rejects placement only when the member already has more than three active holds; with three it accepts a fourth.
    source: legacy/src/main/java/lib/HoldResource.java:52-54
  - id: hold-placement-date
    rule: A newly placed hold records the current local date as placedOn.
    source: legacy/src/main/java/lib/HoldResource.java:55-57
