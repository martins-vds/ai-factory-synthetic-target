slice: hold-management
tickets:
  - id: HM-01
    title: Characterize hold management and write its customer spec
    role: afs-characterizer
    specialty: null
    files:
      - .migration/spec/hold-management/
      - .migration/ledger/hold.place.yaml
      - .migration/ledger/hold.list-active.yaml
      - .migration/ledger/hold.cancel.yaml
      - .migration/ledger/hold.repository.yaml
      - .migration/ledger/hold.storage.yaml
      - .migration/ledger/data.hold-seed-record.yaml
      - .migration/evidence/runs/HM-01.md
      - .migration/returns/HM-01.afs-characterizer.yaml
    capabilities:
      - hold.place
      - hold.list-active
      - hold.cancel
      - hold.repository
      - hold.storage
      - data.hold-seed-record
    blocked_by: []
  - id: HM-02
    title: Design the hold placement decomposition and loan-state lookup seam
    role: afs-planner
    specialty: null
    files:
      - .migration/plan/hold-management.md
      - .migration/returns/HM-02.afs-planner.yaml
    capabilities: []
    blocked_by: [HM-01]
  - id: HM-03
    title: Implement hold placement, listing, cancellation, and persistence
    role: afs-migrator
    specialty: null
    files:
      - config/settings.py
      - config/urls.py
      - src/holds/
      - tests/holds/
      - src/loans/services.py
      - src/loans/repository.py
      - tests/loans/test_services.py
      - tests/loans/test_catalog.py
      - .migration/ledger/hold.place.yaml
      - .migration/ledger/hold.list-active.yaml
      - .migration/ledger/hold.cancel.yaml
      - .migration/ledger/hold.repository.yaml
      - .migration/ledger/hold.storage.yaml
      - .migration/ledger/data.hold-seed-record.yaml
      - .migration/evidence/runs/HM-03.md
      - .migration/returns/HM-03.afs-migrator.yaml
    capabilities:
      - hold.place
      - hold.list-active
      - hold.cancel
      - hold.repository
      - hold.storage
      - data.hold-seed-record
    blocked_by: [HM-01, HM-02, LL-02]
    builds:
      - endpoint=GET /holds
      - endpoint=POST /holds
      - endpoint=POST /holds/<str:hold_id>/cancel
  - id: HM-04
    title: Characterize and specify the precedence of simultaneous hold-placement refusals
    role: afs-characterizer
    specialty: null
    files:
      - .migration/characterization/source/characterize.py
      - .migration/characterization/source/goldens/hold-precedence.json
      - .migration/references/characterization-HM-04.md
      - .migration/spec/hold-management/hold.place.yaml
      - .migration/ledger/hold.place.yaml
      - .migration/returns/HM-04.afs-characterizer.yaml
    capabilities: [hold.place]
    blocked_by: [HM-03]
  - id: HM-05
    title: Prove hold repository rollback on a failed write at the persistence boundary
    role: afs-migrator
    specialty: null
    files:
      - tests/holds/test_repository.py
      - src/holds/repository.py
      - .migration/ledger/hold.repository.yaml
      - .migration/returns/HM-05.afs-migrator.yaml
    capabilities: [hold.repository]
    blocked_by: [HM-03]
  - id: HM-06
    title: Prove the first-refusal-wins rule at the hold placement use case
    role: afs-migrator
    specialty: null
    files:
      - tests/holds/test_services.py
      - src/holds/services.py
      - .migration/returns/HM-06.afs-migrator.yaml
    capabilities: [hold.place]
    blocked_by: [HM-04]
cross_slice:
  - file: config/settings.py
    slices: [loan-catalog, monthly-report, hold-management]
    note: Hold persistence registers alongside the existing loan and report apps.
  - file: config/urls.py
    slices: [loan-catalog, loan-circulation, fees-payments, library-info, hold-management]
    note: The hold API extends the existing root URL composition after the loan slices.
